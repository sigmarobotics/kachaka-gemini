services:
  kachaka-gemini:
    build: .
    image: kachaka-gemini-live:latest
    container_name: kachaka-gemini-live
    ports:
      - "9000:9000"
    networks:
      - app-net
    environment:
      - ROBOT_IP=${ROBOT_IP:-192.168.125.103:26400}
    volumes:
      - ./src/backend:/app
      - ./src/frontend:/app/frontend
      - ./data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --reload --log-level warning
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
