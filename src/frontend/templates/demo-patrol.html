<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrol Dashboard | Kachaka Gemini</title>
    <link rel="stylesheet" href="/static/css/demo-patrol.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
</head>

<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="glass-header">
            <div class="logo">Patrol Dashboard</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('history')">History</button>
                <button class="tab-btn" onclick="switchTab('reports')">Reports</button>
                <button class="tab-btn" onclick="switchTab('stats')">Tokens</button>
            </div>

            <div class="status-bar">
                <a href="/demo" class="back-link">Back</a>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- HISTORY VIEW -->
            <div id="view-history" class="tab-content" style="display: flex;">
                <div class="header">
                    <h1>Patrol History</h1>
                </div>
                <div id="history-list" class="glass-panel"></div>
            </div>

            <!-- REPORTS VIEW -->
            <div id="view-reports" class="tab-content" style="display: none;">
                <div class="header">
                    <h1>Multi-run Reports</h1>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <input type="date" id="report-start-date" title="Start Date">
                        <span style="color: var(--text-muted);">to</span>
                        <input type="date" id="report-end-date" title="End Date">
                        <button id="btn-generate-report" class="btn-premium" style="padding: 8px 16px;">
                            <span class="icon">&#x2728;</span> Generate Report
                        </button>
                    </div>
                </div>
                <div id="reports-list"></div>
            </div>

            <!-- HISTORY DETAIL MODAL -->
            <div id="history-modal">
                <div>
                    <div class="modal-header">
                        <h2 id="modal-title">Report Details</h2>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <button id="btn-save-pdf" class="btn-primary" style="padding: 8px 16px; font-size: 11px;">
                                Save PDF
                            </button>
                            <button onclick="closeHistoryModal()"
                                style="background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 4px 8px;">&times;</button>
                        </div>
                    </div>
                    <div id="modal-content-wrapper" style="flex: 1; overflow-y: auto; padding: 24px;">
                        <div style="margin-bottom: 24px;">
                            <h3>AI Summary Report</h3>
                            <div id="modal-report-content" class="markdown-content"
                                style="background: var(--deep-space); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                            </div>
                        </div>
                        <div id="modal-video-section" style="display: none; margin-bottom: 24px;">
                            <h3>Video Analysis</h3>
                            <div id="modal-video-content" class="markdown-content"
                                style="background: var(--deep-space); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                            </div>
                            <div id="modal-video-download" style="margin-top: 10px;"></div>
                        </div>
                        <div>
                            <h3>Inspection Points</h3>
                            <div id="modal-inspections-list" style="display: flex; flex-direction: column; gap: 12px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STATS VIEW -->
            <div id="view-stats" class="tab-content" style="display: none; padding: 24px;">
                <div class="header">
                    <h1>Token Usage Statistics</h1>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <input type="date" id="stats-start-date">
                        <span style="color: var(--text-muted);">to</span>
                        <input type="date" id="stats-end-date">
                    </div>
                </div>

                <!-- Stats Summary -->
                <div id="stats-summary" class="glass-panel"
                    style="display: flex; justify-content: space-around; padding: 20px; margin-bottom: 20px;">
                    <div class="stat-item" style="text-align: center;">
                        <span class="stat-label"
                            style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Input Tokens</span>
                        <span class="stat-value"
                            style="font-size: 24px; font-weight: bold; color: #28a745; font-family: var(--font-mono);">0</span>
                    </div>
                    <div class="stat-item" style="text-align: center;">
                        <span class="stat-label"
                            style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Output Tokens</span>
                        <span class="stat-value"
                            style="font-size: 24px; font-weight: bold; color: #e67e22; font-family: var(--font-mono);">0</span>
                    </div>
                    <div class="stat-item" style="text-align: center;">
                        <span class="stat-label"
                            style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Total Tokens</span>
                        <span class="stat-value"
                            style="font-size: 24px; font-weight: bold; color: #007bff; font-family: var(--font-mono);">0</span>
                    </div>
                </div>

                <div class="glass-panel" style="position: relative; height: 55vh; width: 100%;">
                    <span style="position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--text-muted); z-index: 1;">Unit: Million Tokens</span>
                    <canvas id="tokenUsageChart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="/static/js/demo-patrol-page.js"></script>
</body>

</html>
